<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - UNL Baja SAE</title>

    <meta name="description" content="Contact UNL Baja SAE: Have questions about sponsorship, joining the team, or general inquiries? Get in touch with us here.">
    <meta property="og:title" content="Contact - UNL Baja SAE">
    <meta property="og:image" content="https://husker-baja.org/images/logo.png">
    <meta property="og:url" content="https://husker-baja.org/contact/">

    <link rel="icon" href="../favicon/favicon.ico" sizes="any">
    <link rel="icon" href="../favicon/favicon-32x32.png" type="image/png">
    <link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
    <link rel="manifest" href="../favicon/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500&family=Squada+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
        <div class="container navbar-container">
            <a class="navbar-brand" href="../">UNL Baja SAE</a>

            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="../">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="../about/">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="../join/">Join</a></li>
                    <li class="nav-item"><a class="nav-link" href="../team/">Our Team</a></li>
                    <li class="nav-item"><a class="nav-link" href="../subsystems/">Subsystems</a></li>
                    <li class="nav-item"><a class="nav-link " href="../sponsors/">Sponsors</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Contact Us</a></li>

                </ul>
            </div>
        </div>
    </nav>

    <main class="pt-3 mt-5">
        <div class="section-heading text-center my-5">
            <h1 class="fw-bold text-uppercase text-danger display-4">
                Contact
            </h1>
            <div class="heading-underline mx-auto mt-2"></div>
        </div>
        <div class="container content-container p-4 mt-4">
            <h1>Contact Us</h1>

            <form id="contactForm" class="needs-validation" method="POST" novalidate>

                <input type="text" id="country" placeholder="Country"  style="display:none !important;">

                <div class="row mb-3 g-3">
                    <div class="col-md">
                        <div class="form-floating">
                            <input name="First Name" type="text" class="form-control" id="floatingFirstName" placeholder="First Name"
                                autocomplete="given-name" required>
                            <label for="floatingFirstName">First Name*</label>
                            <div class="invalid-feedback">Invalid input</div>

                        </div>
                    </div>

                    <div class="col-md">
                        <div class="form-floating">
                            <input name="Last Name" type="text" class="form-control" id="floatingLastName" placeholder="Last Name"
                                autocomplete="family-name" required>
                            <label for="floatingLastName">Last Name*</label>
                            <div class="invalid-feedback">Invalid input</div>

                        </div>
                    </div>
                </div>

                <div class="row mb-3 g-3">
                    <div class="col-md">
                        <div class="form-floating">
                            <input name="Email" type="email" class="form-control" id="floatingEmail" placeholder="example@gmail.com"
                                autocomplete="email" required>
                            <label for="floatingEmail">Email Address*</label>
                            <div class="invalid-feedback">Invalid Email</div>
                        </div>
                    </div>
                    <div class="col-md">
                        <div class="form-floating">
                            <input name="Phone Number" inputmode="numeric" class="form-control" placeholder="Phone Number" id="phoneInput"
                                autocomplete="tel-national">
                            <label for="phoneInput">Phone Number</label>
                        </div>
                    </div>

                </div>

                <div class="row mb-3 g-3">
                    <div class="col-md">
                        <div class="form-floating">
                            <input name="Company Name" type="text" class="form-control" id="floatingInputGrid" placeholder="Company Name">
                            <label for="floatingInputGrid">Company Name</label>
                        </div>
                    </div>

                    <div class="col-md">
                        <div class="form-floating">
                            <select name="Inquiry Type" class="form-select" id="floatingSelect" aria-label="Floating label select" required>
                                <option disabled selected value="">Select an Option</option>
                                <option value="Sponsoring/Donating Inquiry">Sponsoring/Donating Inquiry</option>
                                <option value="Joining our Team">Joining our Team</option>
                                <option value="Other">Other</option>
                            </select>
                            <label for="floatingSelect">Inquiry Type*</label>
                            <div class="invalid-feedback">Please Select an Option</div>
                        </div>
                    </div>
                </div>


                <div class="row mb-3">
                    <div class="col-md">
                        <div name="Comments" class="form-floating">
                            <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2"
                                style="height: 100px"></textarea>
                            <label for="floatingTextarea2">Comments</label>
                        </div>
                    </div>
                </div>

                <button id="submit" type="submit" class="btn btn-danger">Submit</button>

            </form>
            <div id="formStatus" class="mt-3"></div>
        </div>


    </main>


    <footer class="site-footer mt-5 py-4">
        <div class="container text-center">
            <div class="mb-2">
                <a href="https://www.facebook.com/huskerracing" target="_blank" class="footer-icon me-3" alt="Facebook"
                    aria-label="Facebook">
                    <i class="bi bi-facebook"></i>
                </a>
                <a href="https://www.instagram.com/husker_baja" target="_blank" class="footer-icon me-3" alt="Instagram"
                    aria-label="Instagram">
                    <i class="bi bi-instagram"></i>
                </a>
                <a href="mailto:huskerracing@gmail.com" class="footer-icon" alt="Mail" aria-label="Mail">
                    <i class="bi bi-envelope-fill"></i>
                </a>
            </div>
            <p class="mb-0">© 2026 Husker Racing Baja SAE. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../js/contact.js" defer></script>

</body>

</html>
